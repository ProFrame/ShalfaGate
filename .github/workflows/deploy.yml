name: Deploy to GitHub Pages

on:
  push:
    branches: "main" # سيتم النشر تلقائياً عند الرفع على فرع main

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Tenant isolation, the anonymous surface, translation completeness and
      # the routing/storage-key rules. These need no database and no browser,
      # so there is no excuse for them not to gate every deployment.
      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "VITE_SUPABASE_URL is not configured" && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "VITE_SUPABASE_ANON_KEY is not configured" && exit 1)

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          # The custom domain is the canonical deployment root. Absolute asset
          # URLs are required so GitHub Pages' 404.html SPA fallback also works
          # for deep links such as /portal and /signup.
          VITE_BASE_PATH: /
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/' # هذا هو المجلد الذي ينتج عن بناء مشروع Vite

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Database and Edge Function deployment is deliberately gated behind the
  # repository secrets below. The frontend can continue to deploy while a
  # development project has not yet been linked, but once the secrets exist
  # every migration/function change is shipped with the same commit.
  supabase:
    needs: build_site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check Supabase deployment configuration
        id: supabase_config
        shell: bash
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_PROJECT_REF" && -n "$SUPABASE_DB_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment skipped because one or more deployment secrets are absent."
          fi

      - name: Checkout
        if: steps.supabase_config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        if: steps.supabase_config.outputs.enabled == 'true'
        run: npm install --global supabase@2.112.0

      - name: Link Supabase project
        if: steps.supabase_config.outputs.enabled == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push hosted project configuration
        if: steps.supabase_config.outputs.enabled == 'true'
        run: supabase config push

      - name: Push database migrations
        if: steps.supabase_config.outputs.enabled == 'true'
        run: supabase db push

      - name: Deploy Edge Functions
        if: steps.supabase_config.outputs.enabled == 'true'
        run: |
          supabase functions deploy tenant-signup --no-verify-jwt
          supabase functions deploy verify-api --no-verify-jwt
          supabase functions deploy send-email --no-verify-jwt
          supabase functions deploy storage-proxy
          supabase functions deploy invite-employee
